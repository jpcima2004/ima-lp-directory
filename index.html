<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>IMA Landing Page Directory</title>
<style>
  :root{
    --bg:#0f1117; --surface:#181b23; --surface2:#1f2330; --border:#2a2f3e;
    --text:#e8eaf0; --muted:#9aa1b5; --accent:#f5b301; --accent2:#4f8ef7;
    --good:#3ecf8e; --warn:#f0883e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 80px}
  header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
  h1 span{color:var(--accent)}
  .updated{color:var(--muted);font-size:13px}
  .stats{display:flex;gap:24px;margin:18px 0 22px;flex-wrap:wrap}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 20px;min-width:120px}
  .stat b{display:block;font-size:24px;color:var(--accent)}
  .stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .controls{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
  #search{flex:1;min-width:220px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none}
  #search:focus{border-color:var(--accent2)}
  .client-filter{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .chip.active{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:600}
  .client-group{margin-bottom:28px}
  .client-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 4px;border-bottom:2px solid var(--accent)}
  .client-head h2{font-size:18px;font-weight:700}
  .client-head .domain{color:var(--accent2);font-size:13px;text-decoration:none}
  .client-head .domain:hover{text-decoration:underline}
  .client-head .meta{color:var(--muted);font-size:12px;margin-left:auto}
  .client-head .meta a{color:var(--muted)}
  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:0 0 10px 10px;overflow:hidden}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;padding:10px 12px;background:var(--surface2);cursor:pointer;user-select:none;white-space:nowrap}
  th:hover{color:var(--text)}
  th .arrow{font-size:9px;margin-left:4px}
  td{padding:11px 12px;border-top:1px solid var(--border);font-size:14px;vertical-align:middle}
  tr:hover td{background:var(--surface2)}
  .lp-name{font-weight:600}
  .path{color:var(--muted);font-size:12px;font-family:ui-monospace,Menlo,monospace}
  a.open{color:var(--accent2);text-decoration:none;font-weight:600;font-size:13px;white-space:nowrap}
  a.open:hover{text-decoration:underline}
  .ty{font-size:13px}
  .ty a{color:var(--good);text-decoration:none}
  .ty .none{color:var(--muted)}
  .copy{background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);font-size:12px;padding:4px 10px;cursor:pointer}
  .copy:hover{border-color:var(--accent2);color:var(--accent2)}
  .copy.done{border-color:var(--good);color:var(--good)}
  .note{color:var(--warn);font-size:12px}
  .empty{padding:24px;text-align:center;color:var(--muted);display:none}
  footer{margin-top:40px;color:var(--muted);font-size:12px;text-align:center}
  @media(max-width:640px){ .hide-sm{display:none} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>IMA <span>Landing Page</span> Directory</h1>
    <div class="updated">Last refreshed: <b id="ts">July 24, 2026</b></div>
  </header>
  <div class="stats">
    <div class="stat"><b id="stat-clients">0</b><span>Clients</span></div>
    <div class="stat"><b id="stat-pages">0</b><span>Landing Pages</span></div>
    <div class="stat"><b id="stat-visible">0</b><span>Shown</span></div>
  </div>
  <div class="controls">
    <input id="search" type="text" placeholder="Search pages, services, regions…">
    <div class="client-filter" id="chips"></div>
  </div>
  <div id="groups"></div>
  <div class="empty" id="empty">No landing pages match your search.</div>
  <footer>Source of truth: <code>ideasmoneyart/ima-landing-pages</code> · Auto-refreshed weekly by Claude · Ideas Money Art</footer>
</div>

<script>
const DATA = {
  generated: "2026-07-24",
  clients: [
    {
      slug: "bfp-bayarea",
      name: "BFP Bay Area",
      brand: "Benjamin Franklin Plumbing",
      base: "https://go.bfplumbingbayarea.com",
      netlify: "https://app.netlify.com/projects/ima-lp-bfp-bayarea",
      note: "",
      pages: [
        {slug:"drain-cleaning-east-bay", thanks:true},
        {slug:"drain-cleaning-marin-county", thanks:true},
        {slug:"drain-cleaning-peninsula", thanks:true},
        {slug:"drain-cleaning-sf", thanks:true},
        {slug:"drain-cleaning-south-bay", thanks:true},
        {slug:"plumber-east-bay", thanks:true},
        {slug:"plumber-marin-county", thanks:true},
        {slug:"plumber-peninsula", thanks:true},
        {slug:"plumber-san-jose", thanks:true},
        {slug:"plumber-sf", thanks:true},
        {slug:"water-heater-installation-repair-east-bay", thanks:true},
        {slug:"water-heater-installation-repair-marin-county", thanks:true},
        {slug:"water-heater-installation-repair-peninsula", thanks:true},
        {slug:"water-heater-installation-repair-san-jose", thanks:true},
        {slug:"water-heater-installation-repair-sf", thanks:true},
        {slug:"water-heater-repair-peninsula", thanks:false},
        {slug:"water-heater-repair-south-bay", thanks:true}
      ]
    },
    {
      slug: "bfp-tucson",
      name: "BFP Tucson",
      brand: "Benjamin Franklin Plumbing of Greater Tucson",
      base: "https://go.bfplumbingtucson.com",
      netlify: "https://app.netlify.com/projects/ima-lp-bfp-tucson",
      note: "",
      pages: [
        {slug:"toilet-repair-tucson", thanks:false}
      ]
    },
    {
      slug: "lyon-restoration",
      name: "Lyon Restoration",
      brand: "",
      base: "https://ima-lp-lyon-restoration.netlify.app",
      netlify: "https://app.netlify.com/projects/ima-lp-lyon-restoration",
      note: "Custom domain go.lyonrestoration.com not yet connected in Netlify",
      pages: [
        {slug:"commercial-restoration-bay-area", thanks:true}
      ]
    },
    {
      slug: "all-abuzz",
      name: "All Abuzz Electric",
      brand: "formerly JEOAH Electric",
      base: "https://ima-lp-all-abuzz.netlify.app",
      netlify: "https://app.netlify.com/projects/ima-lp-all-abuzz",
      note: "",
      pages: [
        {slug:"teacher-clear-the-list-lehigh-valley", thanks:true}
      ]
    }
  ]
};

function titleCase(slug){
  return slug.split("-").map(w=>{
    const u = {sf:"SF", hvac:"HVAC", ac:"AC"}[w]; if(u) return u;
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(" ");
}

let activeClient = "all";
let sortState = {};

function render(){
  const q = document.getElementById("search").value.toLowerCase().trim();
  const groupsEl = document.getElementById("groups");
  groupsEl.innerHTML = "";
  let totalPages = 0, visible = 0;

  DATA.clients.forEach(c=>{
    totalPages += c.pages.length;
    if(activeClient !== "all" && activeClient !== c.slug) return;
    let pages = c.pages.filter(p=>{
      if(!q) return true;
      return (p.slug + " " + c.name + " " + c.brand).toLowerCase().includes(q);
    });
    const sort = sortState[c.slug];
    if(sort){
      pages = pages.slice().sort((a,b)=>{
        let va, vb;
        if(sort.col==="name"){ va=a.slug; vb=b.slug; }
        else { va=a.thanks?1:0; vb=b.thanks?1:0; }
        return (va<vb?-1:va>vb?1:0) * (sort.dir==="asc"?1:-1);
      });
    }
    if(pages.length===0) return;
    visible += pages.length;

    const g = document.createElement("div");
    g.className = "client-group";
    const noteHtml = c.note ? `<span class="note">⚠ ${c.note}</span>` : "";
    g.innerHTML = `
      <div class="client-head">
        <h2>${c.name}</h2>
        ${c.brand?`<span style="color:var(--muted);font-size:13px">${c.brand}</span>`:""}
        <a class="domain" href="${c.base}" target="_blank" rel="noopener">${c.base.replace("https://","")}</a>
        ${noteHtml}
        <span class="meta">${pages.length} page${pages.length!==1?"s":""} · <a href="${c.netlify}" target="_blank" rel="noopener">Netlify ↗</a></span>
      </div>
      <table>
        <thead><tr>
          <th data-col="name" data-client="${c.slug}">Landing Page<span class="arrow"></span></th>
          <th class="hide-sm">Path</th>
          <th data-col="thanks" data-client="${c.slug}">Thank-You Pg<span class="arrow"></span></th>
          <th></th><th></th>
        </tr></thead>
        <tbody>
          ${pages.map(p=>{
            const url = c.base + "/" + p.slug;
            const ty = p.thanks
              ? `<a href="${url}-thanks" target="_blank" rel="noopener">✓ view</a>`
              : `<span class="none">—</span>`;
            return `<tr>
              <td class="lp-name">${titleCase(p.slug)}</td>
              <td class="path hide-sm">/${p.slug}</td>
              <td class="ty">${ty}</td>
              <td><a class="open" href="${url}" target="_blank" rel="noopener">Open LP ↗</a></td>
              <td><button class="copy" data-url="${url}">Copy URL</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>`;
    groupsEl.appendChild(g);
  });

  document.getElementById("stat-clients").textContent = DATA.clients.length;
  document.getElementById("stat-pages").textContent = totalPages;
  document.getElementById("stat-visible").textContent = visible;
  document.getElementById("empty").style.display = visible===0 ? "block":"none";

  groupsEl.querySelectorAll("th[data-col]").forEach(th=>{
    th.addEventListener("click",()=>{
      const cs = th.dataset.client, col = th.dataset.col;
      const cur = sortState[cs];
      sortState[cs] = {col, dir: cur && cur.col===col && cur.dir==="asc" ? "desc":"asc"};
      render();
    });
  });
  groupsEl.querySelectorAll(".copy").forEach(btn=>{
    btn.addEventListener("click",()=>{
      navigator.clipboard.writeText(btn.dataset.url).then(()=>{
        btn.textContent="Copied ✓"; btn.classList.add("done");
        setTimeout(()=>{btn.textContent="Copy URL"; btn.classList.remove("done");},1500);
      });
    });
  });
}

function buildChips(){
  const chips = document.getElementById("chips");
  const all = [{slug:"all",name:"All Clients"}].concat(DATA.clients);
  chips.innerHTML = all.map(c=>`<span class="chip${c.slug==="all"?" active":""}" data-slug="${c.slug}">${c.name}</span>`).join("");
  chips.querySelectorAll(".chip").forEach(ch=>{
    ch.addEventListener("click",()=>{
      activeClient = ch.dataset.slug;
      chips.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
      ch.classList.add("active");
      render();
    });
  });
}

document.getElementById("ts").textContent = new Date(DATA.generated+"T12:00:00").toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"});
document.getElementById("search").addEventListener("input", render);
buildChips();
render();
</script>
</body>
</html>
